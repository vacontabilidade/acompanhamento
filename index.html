<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Acompanhamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ==========================================================================
     TOKENS — paleta "livro-razão": papel + tinta-marinho + selo de latão
     ========================================================================== */
  :root{
    --paper: #F2EEE2;
    --paper-deep: #E8E1CC;
    --rule: #D2C7A9;
    --ink: #182238;
    --ink-soft: #4C5A72;
    --card: #FFFEF9;
    --accent: #BD8A2E;
    --accent-deep: #8C6A22;
    --good: #3E6B54;
    --bad: #A23A3A;
    --sombra: 0 6px 18px rgba(24,34,56,0.10);
    --raio: 10px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 27px, var(--rule) 28px),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; margin:0 0 6px; color:var(--ink); }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:var(--accent-deep); }

  /* ---------- LOGIN ---------- */
  .tela-login{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
  .cartao-login{
    background:var(--card); border:1px solid var(--rule); border-radius:var(--raio);
    box-shadow:var(--sombra); padding:40px 36px; width:100%; max-width:380px; position:relative;
  }
  .selo{
    position:absolute; top:-16px; left:32px; background:var(--ink); color:var(--paper);
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em;
    padding:5px 12px; border-radius:4px; text-transform:uppercase;
  }
  .cartao-login h1{ font-size:24px; margin-top:8px; }
  .subtitulo{ color:var(--ink-soft); font-size:14px; margin:0 0 22px; }
  .cartao-login form{ display:flex; flex-direction:column; gap:14px; }
  label{ display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--ink-soft); font-weight:500; }
  input, select, textarea{
    font-family:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--rule);
    border-radius:6px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .botao-primario{
    background:var(--ink); color:var(--paper); border:none; border-radius:6px;
    padding:11px 16px; font-size:14px; font-weight:600; letter-spacing:.02em;
  }
  .botao-primario:hover{ background:#0e1728; }
  .botao-secundario{
    background:transparent; color:var(--ink); border:1px solid var(--rule); border-radius:6px;
    padding:9px 14px; font-size:13px; font-weight:500;
  }
  .botao-secundario:hover{ background:var(--paper-deep); }
  .botao-linkado{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; font-size:13px; }
  .aviso-erro{ background:#F6E4E4; color:var(--bad); border:1px solid #E3B7B7; border-radius:6px; padding:8px 10px; font-size:13px; }
  .aviso-sucesso{ background:#E5EFE9; color:var(--good); border:1px solid #B9D9C7; border-radius:6px; padding:8px 10px; font-size:13px; }
  .dica-demo{ margin-top:18px; font-size:12px; color:var(--ink-soft); background:var(--paper-deep); border-radius:6px; padding:10px 12px; }
  .dica-demo code{ background:#fff; padding:1px 5px; border-radius:3px; }
  .faixa-demo{
    background:var(--accent); color:#241a05; text-align:center; font-size:13px; font-weight:600;
    padding:8px 12px; letter-spacing:.02em;
  }

  /* ---------- SHELL ---------- */
  .app-shell{ min-height:100vh; display:flex; flex-direction:column; }
  .topo{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--ink); color:var(--paper); padding:12px 22px;
  }
  .marca{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; display:flex; align-items:center; gap:8px; }
  .marca-selo{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border:1px solid var(--accent); border-radius:50%; color:var(--accent); font-size:12px; }
  .usuario-info{ display:flex; align-items:center; gap:12px; font-size:13px; }
  .cracha{ font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:.08em; padding:3px 9px; border-radius:20px; border:1px solid var(--accent); color:var(--accent); }
  .cracha-admin{ border-color:#7FBF9E; color:#7FBF9E; }
  .usuario-info .botao-linkado{ color:var(--paper); opacity:.75; }

  .corpo{ flex:1; display:flex; min-height:0; }
  .lateral{ width:210px; background:var(--paper-deep); border-right:1px solid var(--rule); padding:16px 10px; display:flex; flex-direction:column; gap:4px; }
  .aba-lateral{
    text-align:left; background:none; border:none; border-left:3px solid transparent;
    padding:10px 12px; font-size:14px; border-radius:0 6px 6px 0; color:var(--ink-soft); font-weight:500;
  }
  .aba-lateral:hover{ background:rgba(189,138,46,0.10); }
  .aba-lateral.ativa{ background:var(--card); border-left-color:var(--accent); color:var(--ink); box-shadow:var(--sombra); }

  .conteudo{ flex:1; padding:26px 30px; overflow:auto; }
  .cabecalho-conteudo{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .acoes-cabecalho{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

  /* ---------- BARRA DE ATUALIZAÇÃO ---------- */
  .barra-atualizacao{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--ink-soft); }
  .barra-atualizacao select{ padding:6px 8px; font-size:13px; }
  .toggle-auto{ display:flex; align-items:center; gap:6px; font-weight:500; }
  .ultima-atualizacao{ font-family:'IBM Plex Mono', monospace; font-size:12px; }
  .aviso-discreto{ background:#FBF1DC; border:1px solid #E4CB92; color:#7A5A16; font-size:13px; padding:8px 12px; border-radius:6px; margin-bottom:14px; }
  .barra-busca{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .barra-busca input{ flex:1; max-width:480px; }
  .contagem-busca{ font-size:12px; color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; }
  .ferramenta-historico{ display:flex; gap:8px; margin-top:-4px; flex-wrap:wrap; }
  .ferramenta-historico input{ flex:1; min-width:160px; }
  .ferramenta-historico select{ flex:0 0 auto; min-width:160px; }
  .textarea-somente-leitura{ background:var(--paper-deep); color:var(--ink-soft); cursor:default; }
  input:disabled, select:disabled, textarea:disabled{ background:var(--paper-deep); color:var(--ink-soft); cursor:not-allowed; opacity:.85; }
  .barra-progresso{ height:4px; background:var(--paper-deep); border-radius:3px; overflow:hidden; margin-top:10px; }
  .barra-progresso .tira{ height:100%; width:35%; background:var(--accent); border-radius:3px; animation:deslizarProgresso 1.1s ease-in-out infinite; }
  .barra-progresso-topo{ position:fixed; top:0; left:0; width:100%; height:3px; overflow:hidden; z-index:200; background:transparent; }
  .barra-progresso-topo .tira{ height:100%; width:30%; background:var(--accent); animation:deslizarProgresso 1.1s ease-in-out infinite; }
  @keyframes deslizarProgresso{ 0%{ margin-left:-35%; } 100%{ margin-left:100%; } }

  /* ---------- DASHBOARD ---------- */
  .grade-kpis{ display:flex; flex-wrap:wrap; gap:18px; margin:8px 0 26px; }
  .cartao-kpi{
    background:var(--card); border:1px solid var(--rule); border-radius:var(--raio);
    padding:16px 22px; min-width:140px; box-shadow:var(--sombra); text-align:center;
  }
  .selo-kpi{
    width:64px; height:64px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center;
    border:2px double var(--accent); border-radius:50%; color:var(--accent-deep);
    font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; transform:rotate(-4deg);
  }
  .rotulo-kpi{ font-size:13px; color:var(--ink-soft); font-weight:500; }
  .cartao-grafico{ background:var(--card); border:1px solid var(--rule); border-radius:var(--raio); padding:18px 20px; margin-bottom:16px; box-shadow:var(--sombra); }
  .cartao-grafico h3{ font-size:15px; margin-bottom:12px; }
  .svg-grafico{ width:100%; max-width:440px; height:auto; }
  .rotulo-grafico{ font-family:'IBM Plex Sans',sans-serif; font-size:11px; fill:var(--ink-soft); }
  .valor-grafico{ font-family:'IBM Plex Mono',monospace; font-size:11px; fill:var(--ink); }

  /* ---------- TABELA ---------- */
  .area-tabela{ background:var(--card); border:1px solid var(--rule); border-radius:var(--raio); overflow:auto; box-shadow:var(--sombra); }
  table.tabela-ledger{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .tabela-ledger th{
    text-align:left; padding:11px 14px; background:var(--paper-deep); color:var(--ink-soft);
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; border-bottom:1px solid var(--rule); white-space:nowrap;
  }
  .tabela-ledger td{ padding:10px 14px; border-bottom:1px solid var(--paper-deep); vertical-align:top; }
  .tabela-ledger tr:hover td{ background:rgba(189,138,46,0.05); }
  .tabela-ledger td.vazio{ text-align:center; color:var(--ink-soft); padding:26px; }
  .vazio-inline{ color:#B7AF98; }
  .texto-longo-celula{ white-space:pre-wrap; display:inline-block; max-width:340px; line-height:1.45; }
  .celula-acoes{ white-space:nowrap; text-align:right; }
  .botao-icone{ background:none; border:1px solid var(--rule); border-radius:5px; padding:4px 8px; margin-left:4px; font-size:13px; }
  .botao-icone:hover{ background:var(--paper-deep); }
  .botao-icone.perigo:hover{ background:#F6E4E4; border-color:#E3B7B7; }
  .etiqueta{
    display:inline-block; font-size:12px; font-weight:600; padding:3px 10px; border-radius:20px;
    color:#fff; background:var(--cor-etiqueta, var(--ink-soft));
  }

  /* ---------- MODAL ---------- */
  .sobreposicao{ position:fixed; inset:0; background:rgba(24,34,56,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal-caixa{ background:var(--card); border-radius:var(--raio); padding:26px 26px 20px; width:100%; max-width:460px; max-height:88vh; overflow:auto; box-shadow:0 14px 40px rgba(0,0,0,0.25); }
  .modal-caixa form{ display:flex; flex-direction:column; gap:13px; margin-top:14px; }
  .acoes-modal{ display:flex; justify-content:flex-end; gap:10px; margin-top:8px; }
  textarea{ resize:vertical; min-height:64px; font-family:inherit; }

  /* ---------- RESPONSIVO ---------- */
  @media (max-width: 760px){
    .corpo{ flex-direction:column; }
    .lateral{ width:100%; flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--rule); }
    .aba-lateral{ border-left:none; border-bottom:3px solid transparent; white-space:nowrap; border-radius:6px 6px 0 0; }
    .aba-lateral.ativa{ border-bottom-color:var(--accent); }
    .conteudo{ padding:18px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================================
   CONFIGURAÇÃO
   - Se CONFIG.API_URL estiver vazio, o painel roda sozinho em MODO
     DEMONSTRAÇÃO com dados de exemplo guardados em variáveis JavaScript
     (nunca em localStorage/sessionStorage), só durante esta sessão.
   - Para ligar à planilha de verdade, publique o Code.gs como Web App e
     cole a URL aqui (veja o GUIA_DE_CONFIGURACAO.md).
   ========================================================================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzAAEnhHT3mJi3ZQf6Yp2XT1FEvpyiwJGXAlfsUDRUHePHs4zaVIlkJXpAY57Zmkh5i/exec', // <<< cole aqui a URL do seu Web App do Apps Script
  INTERVALOS_AUTO: [1, 5, 10]
};

/* ============================================================================
   MODO DEMONSTRAÇÃO — "planilha" fictícia em memória (array de arrays,
   igual ao que getDataRange().getValues() devolveria no Apps Script).
   Isso existe só para o painel funcionar sozinho, com duplo clique, sem
   nenhum backend. Troque à vontade para testar a adaptação automática:
   adicione uma coluna aqui e ela aparece sozinha no painel.
   ========================================================================== */
function gerarUuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    const r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}

let DEMO_DB = {
  Acompanhamento: [
    ['ID','Assunto','SubAssunto','Situação','Responsável','Data','Plano de Ação'],
    [gerarUuid(),'Compliance','Obrigações','Em andamento','Ana Souza','2026-08-15','Revisar checklist regulatório do trimestre e enviar relatório de conformidade à diretoria.'],
    [gerarUuid(),'Financeiro','Obrigações','Pendente','Carlos Lima','2026-08-02','Levantar guias de recolhimento em atraso e reunir com o financeiro para regularização.'],
    [gerarUuid(),'Jurídico','Contratos','Atrasado','Beatriz Rocha','2026-07-20','Renegociar cláusulas do contrato com o fornecedor X antes do vencimento.'],
    [gerarUuid(),'Operacional','Processos','Concluído','Ana Souza','2026-07-10','Mapeamento do processo de compras finalizado e homologado pela gerência.'],
    [gerarUuid(),'Compliance','Auditoria','Em andamento','Beatriz Rocha','2026-08-28','Preparar documentação para a auditoria externa anual.'],
    [gerarUuid(),'Jurídico','Obrigações','Pendente','Carlos Lima','2026-08-05','Protocolar renovação de licença junto ao órgão regulador.']
  ],
  Opcoes: [
    ['Assunto','SubAssunto','Situação','Responsável'],
    ['Financeiro','Obrigações','Pendente','Ana Souza'],
    ['Jurídico','Contratos','Em andamento','Carlos Lima'],
    ['Compliance','Auditoria','Concluído','Beatriz Rocha'],
    ['Operacional','Processos','Atrasado','Comissão']
  ],
  Usuarios: [
    ['Usuario','Senha','Papel'],
    ['admin','admin123','admin'],
    ['operador','operador123','operador']
  ]
};

// ---- versões em JavaScript das mesmas funções do Code.gs, operando sobre DEMO_DB ----
function demoAbaParaObjetos(nomeAba){
  const tabela = DEMO_DB[nomeAba];
  if(!tabela) return [];
  const cabecalho = tabela[0];
  const lista = [];
  for(let i=1;i<tabela.length;i++){
    const linha = tabela[i];
    const vazio = linha.every(v=>v===''||v===null||v===undefined);
    if(vazio) continue;
    const obj = {};
    cabecalho.forEach((nome,idx)=>{ if(nome) obj[nome]=linha[idx]; });
    obj._linha = i+1;
    lista.push(obj);
  }
  return lista;
}
function demoListasDeOpcoes(){
  const tabela = DEMO_DB['Opcoes'];
  const mapa = {};
  if(!tabela) return mapa;
  const cabecalho = tabela[0];
  cabecalho.forEach((nomeLista,col)=>{
    if(!nomeLista) return;
    const opcoes=[];
    for(let i=1;i<tabela.length;i++){
      const v = tabela[i][col];
      if(v!==''&&v!==null&&v!==undefined) opcoes.push(v);
    }
    mapa[nomeLista]=opcoes;
  });
  return mapa;
}
function demoTipoColuna(nomeAba, indiceColuna){
  const tabela = DEMO_DB[nomeAba];
  let achouData=false, achouNumero=false, achouTexto=false, maiorTexto=0;
  for(let i=1;i<tabela.length;i++){
    const v = tabela[i][indiceColuna];
    if(v===''||v===null||v===undefined) continue;
    if(typeof v === 'number') achouNumero=true;
    else if(/^\d{4}-\d{2}-\d{2}$/.test(v)) achouData=true;
    else { achouTexto=true; maiorTexto=Math.max(maiorTexto, String(v).length); }
  }
  if(achouTexto) return maiorTexto>60 ? 'texto_longo' : 'texto';
  if(achouData) return 'data';
  if(achouNumero) return 'numero';
  return 'texto';
}
function demoAbasDeDados(){ return Object.keys(DEMO_DB).filter(n=>n!=='Usuarios'&&n!=='Opcoes'); }
function demoSchema(){
  const listas = demoListasDeOpcoes();
  const nomesListas = Object.keys(listas);
  const abas=[];
  demoAbasDeDados().forEach(nomeAba=>{
    const cabecalho = DEMO_DB[nomeAba][0];
    const colunas=[];
    cabecalho.forEach((nomeColuna,c)=>{
      if(!nomeColuna) return;
      const ehId = c===0 && String(nomeColuna).toUpperCase()==='ID';
      const info = { nome: nomeColuna, ehId };
      if(nomesListas.indexOf(nomeColuna)!==-1){ info.tipo='select'; info.opcoes=listas[nomeColuna]; }
      else if(!ehId){
        info.tipo=demoTipoColuna(nomeAba,c);
        // a última coluna da aba é sempre um campo de texto de várias linhas
        // (ex.: "Plano de Ação"), mesmo que os exemplos atuais sejam curtos.
        if(c===cabecalho.length-1 && info.tipo!=='data' && info.tipo!=='numero'){ info.tipo='texto_longo'; }
      }
      else info.tipo='texto';
      colunas.push(info);
    });
    abas.push({ nome:nomeAba, colunas });
  });
  return { ok:true, abas };
}
function demoLogin(d){
  const usuarios = demoAbaParaObjetos('Usuarios');
  const achou = usuarios.find(u=>String(u.Usuario)===String(d.usuario)&&String(u.Senha)===String(d.senha));
  return achou ? { ok:true, usuario:achou.Usuario, papel:achou.Papel } : { ok:false, erro:'Usuário ou senha inválidos.' };
}
function demoListar(d){ return { ok:true, registros: demoAbaParaObjetos(d.aba) }; }
function demoCriar(d){
  const tabela = DEMO_DB[d.aba];
  const cabecalho = tabela[0];
  const novoId = gerarUuid();
  const registro = d.registro || {};
  const novaLinha = cabecalho.map((nome,c)=> (c===0 && String(nome).toUpperCase()==='ID') ? novoId : (registro[nome]!==undefined?registro[nome]:''));
  tabela.push(novaLinha);
  const criado = {};
  cabecalho.forEach((n,i)=>criado[n]=novaLinha[i]);
  return { ok:true, registro:criado };
}
function demoAtualizar(d){
  const tabela = DEMO_DB[d.aba];
  const cabecalho = tabela[0];
  for(let i=1;i<tabela.length;i++){
    if(String(tabela[i][0])===String(d.id)){
      cabecalho.forEach((nome,c)=>{ if(c>0 && d.registro[nome]!==undefined) tabela[i][c]=d.registro[nome]; });
      return { ok:true };
    }
  }
  return { ok:false, erro:'Registro não encontrado.' };
}
function demoExcluir(d){
  const tabela = DEMO_DB[d.aba];
  for(let i=1;i<tabela.length;i++){
    if(String(tabela[i][0])===String(d.id)){ tabela.splice(i,1); return { ok:true }; }
  }
  return { ok:false, erro:'Registro não encontrado.' };
}
function demoTrocarSenha(d){
  if(!d.novaSenha || String(d.novaSenha).length < 4){
    return { ok:false, erro:'A nova senha precisa ter pelo menos 4 caracteres.' };
  }
  const tabela = DEMO_DB['Usuarios'];
  const cabecalho = tabela[0];
  const idxUsuario = cabecalho.indexOf('Usuario');
  const idxSenha = cabecalho.indexOf('Senha');
  for(let i=1;i<tabela.length;i++){
    if(String(tabela[i][idxUsuario])===String(d.usuario) && String(tabela[i][idxSenha])===String(d.senhaAtual)){
      tabela[i][idxSenha] = d.novaSenha;
      return { ok:true };
    }
  }
  return { ok:false, erro:'Senha atual incorreta.' };
}
function demoDashboard(){
  const estrutura = demoSchema().abas;
  const resultado = {};
  estrutura.forEach(infoAba=>{
    const registros = demoAbaParaObjetos(infoAba.nome);
    const distrib = {};
    infoAba.colunas.forEach(col=>{
      if(col.tipo!=='select') return;
      const contagem = {};
      col.opcoes.forEach(op=>contagem[op]=0);
      registros.forEach(r=>{ const v=r[col.nome]; if(v!==undefined&&v!=='') contagem[v]=(contagem[v]||0)+1; });
      distrib[col.nome]=contagem;
    });
    resultado[infoAba.nome] = { total: registros.length, distribuicoes: distrib };
  });
  return { ok:true, painel: resultado, geradoEm: new Date().toISOString() };
}

/* ============================================================================
   CHAMADA ÚNICA DE API — usa a planilha real se CONFIG.API_URL estiver
   preenchida, ou os dados de demonstração acima se estiver vazia.
   ========================================================================== */
function apiCall(action, data){
  data = data || {};
  if(!CONFIG.API_URL){
    return new Promise(resolve=>{
      setTimeout(()=>{
        let resultado;
        switch(action){
          case 'login': resultado = demoLogin(data); break;
          case 'schema': resultado = demoSchema(); break;
          case 'listar': resultado = demoListar(data); break;
          case 'criar': resultado = demoCriar(data); break;
          case 'atualizar': resultado = demoAtualizar(data); break;
          case 'excluir': resultado = demoExcluir(data); break;
          case 'dashboard': resultado = demoDashboard(); break;
          case 'trocarSenha': resultado = demoTrocarSenha(data); break;
          default: resultado = { ok:false, erro:'Ação desconhecida.' };
        }
        resolve(resultado);
      }, 260); // pequeno atraso só para o estado de "carregando" ficar visível
    });
  }
  return fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight de CORS com Apps Script
    body: JSON.stringify({ action, data })
  })
  .then(r=>r.json())
  .catch(()=>({ ok:false, erro:'Falha de conexão com a planilha.' }));
}

function escapeHtml(v){
  if(v===undefined||v===null) return '';
  return String(v).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function formatarHora(d){
  return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
function formatarDataBR(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');
  return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso||'');
}
function converterBRparaISO(brStr){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(brStr||'').trim());
  return m ? `${m[3]}-${m[2]}-${m[1]}` : (brStr||'');
}
function barraProgresso(){
  return '<div class="barra-progresso"><div class="tira"></div></div>';
}
const PALETA = ['#BD8A2E','#3E6B54','#48566E','#A23A3A','#7A5C9E','#2E7D8C'];
function corPaleta(i){ return PALETA[((i%PALETA.length)+PALETA.length)%PALETA.length]; }

}

function filtrarContagemPositiva(contagem){
  const resultado = {};
  Object.entries(contagem||{}).forEach(([rotulo,valor])=>{ if(valor>0) resultado[rotulo]=valor; });
  return resultado;
}

function viewDashboard(){
  const painel = estado.painel || {};
  const todasAsAbas = Object.keys(painel);
  const abasComDados = todasAsAbas.filter(nome => painel[nome].total > 0);

  const cartoesGraficos = abasComDados.map(nome =>
    Object.keys(painel[nome].distribuicoes||{}).map(nomeColuna=>{
      const contagem = filtrarContagemPositiva(painel[nome].distribuicoes[nomeColuna]);
      if(Object.keys(contagem).length===0) return ''; // nada lançado nessa lista ainda: não mostra o card
      return `<div class="cartao-grafico">
        <h3>${escapeHtml(nome)} — ${escapeHtml(nomeColuna)}</h3>
        ${graficoBarrasSVG(contagem)}
      </div>`;
    }).join('')
  ).join('');

  return `
    <div class="cabecalho-conteudo">
      <h2>Dashboard</h2>
      ${barraAtualizacao()}
    </div>
    ${estado.erroAtualizacao ? `<div class="aviso-discreto">${escapeHtml(estado.erroAtualizacao)}</div>` : ''}

    ${todasAsAbas.length>0 && abasComDados.length===0 ? '<p style="color:var(--ink-soft)">Nenhum dado lançado ainda.</p>' : ''}
    ${abasComDados.length>0 ? `<div class="grade-kpis">
      ${abasComDados.map(nome=>`
        <div class="cartao-kpi">
          <div class="selo-kpi">${painel[nome].total}</div>
          <div class="rotulo-kpi">${escapeHtml(nome)}</div>
        </div>`).join('')}
    </div>` : ''}
    ${cartoesGraficos}
  `;
}

function graficoBarrasSVG(contagem){
  const entradas = Object.entries(contagem||{});
  if(entradas.length===0) return '';
  const max = Math.max(1, ...entradas.map(([,v])=>v));
  const alturaLinha = 26;
  const altura = entradas.length*alturaLinha + 8;
  const larguraBarra = 220;
  const barras = entradas.map(([rotulo,valor],i)=>{
    const y = i*alturaLinha;
    const largura = Math.max(2, Math.round((valor/max)*larguraBarra));
    const cor = corPaleta(i);
    const rotuloCurto = String(rotulo).length>16 ? String(rotulo).slice(0,15)+'…' : String(rotulo);
    return `<text x="0" y="${y+13}" class="rotulo-grafico">${escapeHtml(rotuloCurto)}</text>
            <rect x="120" y="${y+2}" width="${largura}" height="15" rx="3" fill="${cor}"></rect>
            <text x="${120+largura+8}" y="${y+13}" class="valor-grafico">${valor}</text>`;
  }).join('');
  return `<svg viewBox="0 0 380 ${altura}" class="svg-grafico" role="img" aria-label="Gráfico de distribuição">${barras}</svg>`;
}

function celulaFormatada(coluna, valor){
  if(valor===undefined||valor===null||valor==='') return '<span class="vazio-inline">—</span>';
  if(coluna.tipo==='select'){
    const idx = coluna.opcoes.indexOf(valor);
    return `<span class="etiqueta" style="--cor-etiqueta:${corPaleta(idx<0?0:idx)}">${escapeHtml(valor)}</span>`;
  }
  if(coluna.tipo==='data') return `<span class="mono">${escapeHtml(formatarDataBR(valor))}</span>`;
  if(coluna.tipo==='numero') return `<span class="mono">${escapeHtml(valor)}</span>`;
  if(coluna.tipo==='texto_longo') return `<span class="texto-longo-celula">${escapeHtml(valor)}</span>`;
  return escapeHtml(valor);
}

function normalizarBusca(v){
  return String(v==null?'':v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

  return `

    <div class="barra-busca">
      <input type="text" id="buscaTabela" placeholder="🔎 Localizar um registro já preenchido (busca em todas as colunas)…" value="${escapeHtml(estado.filtro)}" oninput="app.filtrarTabela(this.value)">
      ${termo ? `<span class="contagem-busca">${registros.length} de ${todosRegistros.length}</span>` : ''}
    </div>

      <table class="tabela-ledger">
        <thead><tr>${colunas.map(c=>`<th>${escapeHtml(c.nome)}</th>`).join('')}<th></th></tr></thead>
        <tbody>
          ${registros.length===0 ? `<tr><td colspan="${colunas.length+1}" class="vazio">${termo ? 'Nenhum registro encontrado para essa busca.' : 'Nenhum registro ainda. Use "Novo registro" para começar.'}</td></tr>` :
            registros.map(reg=>`
            <tr>
              ${colunas.map(c=>`<td>${celulaFormatada(c, reg[c.nome])}</td>`).join('')}
              <td class="celula-acoes">
                <button class="botao-icone" title="Editar / acrescentar ação" onclick="app.abrirEditar('${escapeHtml(infoAba.nome)}','${escapeHtml(reg.ID)}')">✎</button>
                ${podeExcluir ? `<button class="botao-icone perigo" title="Excluir" onclick="app.excluirRegistro('${escapeHtml(infoAba.nome)}','${escapeHtml(reg.ID)}')">🗑</button>` : ''}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function localizarColunaResponsavel(colunas){
  return (colunas||[]).find(c => c.tipo==='select' && normalizarBusca(c.nome)==='responsavel');
}

function campoFormulario(coluna, valorAtual, indice, todasColunas, somenteLeitura){
  const id = 'campo_'+indice;
  const rotulo = escapeHtml(coluna.nome);
  const desabilitado = somenteLeitura ? 'disabled' : '';
  if(coluna.tipo==='select'){
    return `<label>${rotulo}
      <select id="${id}" ${desabilitado}>
        <option value="">— selecione —</option>
        ${coluna.opcoes.map(op=>`<option value="${escapeHtml(op)}" ${op===valorAtual?'selected':''}>${escapeHtml(op)}</option>`).join('')}
      </select>
    </label>`;
  }
  if(coluna.tipo==='numero') return `<label>${rotulo}<input type="number" step="any" id="${id}" value="${escapeHtml(valorAtual)}" ${desabilitado}></label>`;
  if(coluna.tipo==='data') return `<label>${rotulo}<input type="text" id="${id}" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" value="${escapeHtml(formatarDataBR(valorAtual))}" oninput="app.mascararData(this)" ${desabilitado}></label>`;
  if(coluna.tipo==='texto_longo'){
    const colunaResponsavel = localizarColunaResponsavel(todasColunas);
    return `<label>${rotulo}
        <textarea id="${id}" rows="6" class="textarea-somente-leitura" readonly placeholder="O histórico aparece aqui — use os campos abaixo para adicionar uma nova ação.">${escapeHtml(valorAtual||'')}</textarea>
      </label>
      <div class="ferramenta-historico">
        ${colunaResponsavel ? `<select id="${id}_responsavelEntrada">
          <option value="">Responsável por esta ação…</option>
          ${colunaResponsavel.opcoes.map(op=>`<option value="${escapeHtml(op)}">${escapeHtml(op)}</option>`).join('')}
        </select>` : ''}
        <input type="text" id="${id}_novaEntrada" placeholder="Nova ação realizada agora…">
        <button type="button" class="botao-secundario" onclick="app.adicionarEntradaHistorico('${id}')">+ Adicionar ao histórico</button>
      </div>`;
  }
  return `<label>${rotulo}<input type="text" id="${id}" value="${escapeHtml(valorAtual||'')}" ${desabilitado}></label>`;
}

/* ============================================================================
   AÇÕES DO PAINEL (chamadas pelos onclick/onsubmit no HTML acima)
   ========================================================================== */
const app = {
  async entrar(e){
    e.preventDefault();
    const usuario = document.getElementById('campoUsuario').value.trim();
    const senha = document.getElementById('campoSenha').value;
    estado.enviando = true;
    estado.erroLogin = null;
    renderizar();
    const resp = await apiCall('login', { usuario, senha });
    if(resp.ok){
      estado.usuario = resp.usuario;
      estado.papel = resp.papel;
      estado.erroLogin = null;
      const respSchema = await apiCall('schema', {});
      estado.enviando = false;
      if(respSchema.ok){
        estado.schema = respSchema.abas;
        estado.abaAtiva = 'dashboard';
        renderizar();
        app.atualizarDados();
      } else {
        estado.erroLogin = 'Não foi possível carregar a estrutura da planilha: ' + (respSchema.erro||'');
        estado.usuario = null; estado.papel = null;
        renderizar();
      }
    } else {
      estado.enviando = false;
      estado.erroLogin = resp.erro || 'Não foi possível entrar.';
      renderizar();
    }
  },

  sair(){
    if(estado.timerAuto) clearInterval(estado.timerAuto);
    estado = estadoInicial();
    renderizar();
  },

  selecionarAba(nome){
    estado.abaAtiva = nome;
    estado.filtro = '';
    estado.erroAtualizacao = null;
    renderizar();
    app.atualizarDados();
  },

  filtrarTabela(valor){
    estado.filtro = valor;
    const posicaoCursor = valor.length;
    renderizar();
    const campoBusca = document.getElementById('buscaTabela');
    if(campoBusca){
      campoBusca.focus();
      campoBusca.setSelectionRange(posicaoCursor, posicaoCursor);
    }
  },

  async atualizarDados(){
    estado.carregando = true;
    renderizar();
    try{
      if(estado.abaAtiva === 'dashboard'){
        const resp = await apiCall('dashboard', {});
        if(!resp.ok) throw new Error(resp.erro || 'Falha ao buscar indicadores.');
        estado.painel = resp.painel;
      } else {
        const resp = await apiCall('listar', { aba: estado.abaAtiva });
        if(!resp.ok) throw new Error(resp.erro || 'Falha ao buscar dados.');
        estado.cache[estado.abaAtiva] = resp.registros;
      }
      estado.ultimaAtualizacao = new Date();
      estado.erroAtualizacao = null;
    } catch(err){
      estado.erroAtualizacao = 'Não foi possível atualizar agora. Mostrando os últimos dados carregados.';
    } finally {
      estado.carregando = false;
      renderizar();
    }
  },

  toggleAutoAtualizar(){
    estado.autoAtualizar = !estado.autoAtualizar;
    if(estado.autoAtualizar){
      estado.timerAuto = setInterval(()=>app.atualizarDados(), estado.intervaloMin*60*1000);
    } else if(estado.timerAuto){
      clearInterval(estado.timerAuto);
      estado.timerAuto = null;
    }
    renderizar();
  },

  mudarIntervalo(min){
    estado.intervaloMin = Number(min);
    if(estado.autoAtualizar && estado.timerAuto){
      clearInterval(estado.timerAuto);
      estado.timerAuto = setInterval(()=>app.atualizarDados(), estado.intervaloMin*60*1000);
    }
  },

  abrirNovo(aba){
    estado.modal = { aba, id:null, registroAtual:null };
    renderizar();
  },
  abrirEditar(aba, id){
    const registro = (estado.cache[aba]||[]).find(r=>String(r.ID)===String(id));
    estado.modal = { aba, id, registroAtual: registro };
    renderizar();
  },
  fecharModal(){ estado.modal = null; renderizar(); },
  fecharModalSeClicarFora(e){ if(e.target.classList.contains('sobreposicao')) app.fecharModal(); },

  adicionarEntradaHistorico(idCampo){
    const campoNovaEntrada = document.getElementById(idCampo+'_novaEntrada');
    const areaTexto = document.getElementById(idCampo);
    const campoResponsavel = document.getElementById(idCampo+'_responsavelEntrada');
    const texto = campoNovaEntrada.value.trim();
    if(!texto) { campoNovaEntrada.focus(); return; }
    const agora = new Date();
    const dataHora = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    const responsavel = campoResponsavel ? campoResponsavel.value : '';
    const prefixoResponsavel = responsavel ? ` (${responsavel})` : '';
    const linhaNova = `[${dataHora}]${prefixoResponsavel} ${texto}`;
    areaTexto.value = areaTexto.value ? (areaTexto.value + '\n' + linhaNova) : linhaNova;
    campoNovaEntrada.value = '';
    if(campoResponsavel) campoResponsavel.value = '';
    areaTexto.scrollTop = areaTexto.scrollHeight;
    campoNovaEntrada.focus();
  },

  mascararData(el){
    const digitos = el.value.replace(/\D/g,'').slice(0,8);
    let formatado = digitos;
    if(digitos.length > 4) formatado = digitos.slice(0,2)+'/'+digitos.slice(2,4)+'/'+digitos.slice(4);
    else if(digitos.length > 2) formatado = digitos.slice(0,2)+'/'+digitos.slice(2);
    el.value = formatado;
  },

  async salvarRegistro(e){
    e.preventDefault();
    const { aba, id } = estado.modal;
    const infoAba = estado.schema.find(a=>a.nome===aba);
    const campos = infoAba.colunas.filter(c=>!c.ehId);
    const registro = {};
    campos.forEach((c,i)=>{
      const el = document.getElementById('campo_'+i);
      if(!el) return;
      registro[c.nome] = (c.tipo==='data') ? converterBRparaISO(el.value) : el.value;
    });
    estado.enviando = true;
    renderizar();
    const resp = id
      ? await apiCall('atualizar', { aba, id, registro })
      : await apiCall('criar', { aba, registro });
    estado.enviando = false;
    if(resp.ok){
      estado.modal = null;
      app.atualizarDados();
    } else {
      renderizar();
      alert('Não foi possível salvar: ' + (resp.erro || 'erro desconhecido.'));
    }
  },

  async excluirRegistro(aba, id){
    if(!confirm('Tem certeza que deseja excluir este registro? Essa ação não pode ser desfeita.')) return;
    const resp = await apiCall('excluir', { aba, id });
    if(resp.ok){ app.atualizarDados(); }
    else { alert('Não foi possível excluir: ' + (resp.erro || 'erro desconhecido.')); }
  },

  abrirModalSenha(){
    estado.modalSenha = true;
    estado.erroSenha = null;
    estado.sucessoSenha = null;
    renderizar();
  },
  fecharModalSenha(){
    estado.modalSenha = false;
    renderizar();
  },
  fecharModalSeClicarForaSenha(e){
    if(e.target.classList.contains('sobreposicao')) app.fecharModalSenha();
  },
  async trocarSenha(e){
    e.preventDefault();
    const senhaAtual = document.getElementById('senhaAtual').value;
    const novaSenha = document.getElementById('novaSenha').value;
    const confirmarNovaSenha = document.getElementById('confirmarNovaSenha').value;
    if(novaSenha !== confirmarNovaSenha){
      estado.erroSenha = 'A nova senha e a confirmação não coincidem.';
      estado.sucessoSenha = null;
      renderizar();
      return;
    }
    estado.enviando = true;
    renderizar();
    const resp = await apiCall('trocarSenha', { usuario: estado.usuario, senhaAtual, novaSenha });
    estado.enviando = false;
    if(resp.ok){
      estado.erroSenha = null;
      estado.sucessoSenha = 'Senha alterada com sucesso.';
      renderizar();
      setTimeout(()=>{
        if(estado.sucessoSenha){ estado.modalSenha = false; estado.sucessoSenha = null; renderizar(); }
      }, 1400);
    } else {
      estado.sucessoSenha = null;
      estado.erroSenha = resp.erro || 'Não foi possível alterar a senha.';
      renderizar();
    }
  }
};
window.app = app;

renderizar();
</script>
</body>
</html>
