<style>
  /* ==========================================================================
     TOKENS — paleta "livro-razão": papel + tinta-marinho + selo de latão
     ========================================================================== */
  :root{
    --paper: #F2EEE2;
    --paper-deep: #E8E1CC;
    --rule: #D2C7A9;
    --ink: #182238;
    --ink-soft: #4C5A72;
    --card: #FFFEF9;
    --accent: #BD8A2E;
    --accent-deep: #8C6A22;
    --good: #3E6B54;
    --bad: #A23A3A;
    --sombra: 0 6px 18px rgba(24,34,56,0.10);
    --raio: 10px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 27px, var(--rule) 28px),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; margin:0 0 6px; color:var(--ink); }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:var(--accent-deep); }

  /* ---------- LOGIN ---------- */

  .area-login-centro{ flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .cartao-login{
    background:var(--card); border:1px solid var(--rule); border-radius:var(--raio);
    box-shadow:var(--sombra); padding:40px 36px; width:100%; max-width:380px; position:relative;
  }
  .selo{
    position:absolute; top:-16px; left:32px; background:var(--ink); color:var(--paper);
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em;
    padding:5px 12px; border-radius:4px; text-transform:uppercase;
  }
  .cartao-login h1{ font-size:24px; margin-top:8px; }
  .subtitulo{ color:var(--ink-soft); font-size:14px; margin:0 0 22px; }
  .cartao-login form{ display:flex; flex-direction:column; gap:14px; }
  label{ display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--ink-soft); font-weight:500; }
  input, select, textarea{
    font-family:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--rule);
    border-radius:6px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .botao-primario{
    background:var(--ink); color:var(--paper); border:none; border-radius:6px;
    padding:11px 16px; font-size:14px; font-weight:600; letter-spacing:.02em;
  }
  .botao-primario:hover{ background:#0e1728; }
  .botao-secundario{
    background:transparent; color:var(--ink); border:1px solid var(--rule); border-radius:6px;
    padding:9px 14px; font-size:13px; font-weight:500;
  }
  .botao-secundario:hover{ background:var(--paper-deep); }
  .botao-linkado{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; font-size:13px; }
  .aviso-erro{ background:#F6E4E4; color:var(--bad); border:1px solid #E3B7B7; border-radius:6px; padding:8px 10px; font-size:13px; }
  .aviso-sucesso{ background:#E5EFE9; color:var(--good); border:1px solid #B9D9C7; border-radius:6px; padding:8px 10px; font-size:13px; }
  .dica-demo{ margin-top:18px; font-size:12px; color:var(--ink-soft); background:var(--paper-deep); border-radius:6px; padding:10px 12px; }
  .dica-demo code{ background:#fff; padding:1px 5px; border-radius:3px; }
  .rodape-app{
    text-align:center; font-size:11px; color:var(--ink-soft); padding:10px 14px;
    background:var(--paper-deep); border-top:1px solid var(--rule);
    font-family:'IBM Plex Mono', monospace; letter-spacing:.02em;
  }
  .rodape-app a{ color:var(--accent-deep); text-decoration:none; }
  .rodape-app a:hover{ text-decoration:underline; }
  .faixa-demo{
    background:var(--accent); color:#241a05; text-align:center; font-size:13px; font-weight:600;
    padding:8px 12px; letter-spacing:.02em;
  }

  .usuario-info{ display:flex; align-items:center; gap:12px; font-size:13px; }
  .cracha{ font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:.08em; padding:3px 9px; border-radius:20px; border:1px solid var(--accent); color:var(--accent); }

  .acoes-cabecalho{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

  .barra-atualizacao select{ padding:6px 8px; font-size:13px; }
  .toggle-auto{ display:flex; align-items:center; gap:6px; font-weight:500; }
  .ultima-atualizacao{ font-family:'IBM Plex Mono', monospace; font-size:12px; }

  .cartao-grafico{ background:var(--card); border:1px solid var(--rule); border-radius:var(--raio); padding:18px 20px; margin-bottom:16px; box-shadow:var(--sombra); }

  .cartao-grafico h3{ font-size:15px; margin-bottom:12px; }

  .lista-fracoes{ display:flex; flex-direction:column; gap:7px; max-width:420px; }
  .linha-fracao{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; font-size:13.5px; padding-bottom:6px; border-bottom:1px dashed var(--paper-deep); }

  .tabela-ledger td.vazio{ text-align:center; color:var(--ink-soft); padding:26px; }
  .vazio-inline{ color:#B7AF98; }
  .texto-longo-celula{ white-space:pre-wrap; display:inline-block; max-width:100%; line-height:1.45; }
  .lista-acoes{ display:flex; flex-direction:column; gap:5px; max-width:100%; }
  .linha-acao{ display:flex; gap:7px; align-items:flex-start; line-height:1.45; }
  .carimbo-data-acao{ flex:0 0 auto; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); white-space:nowrap; padding-top:1px; }
  .texto-acao{ flex:1 1 auto; min-width:0; }
  .link-ver-mais{ display:block; background:none; border:none; color:var(--accent-deep); font-size:12px; font-weight:600; text-decoration:underline; padding:4px 0 0; cursor:pointer; }
  .link-ver-mais:hover{ color:var(--accent); }
  .celula-acoes{ white-space:nowrap; text-align:right; }
  .botao-icone{ background:none; border:1px solid var(--rule); border-radius:5px; padding:4px 8px; margin-left:4px; font-size:13px; }
  .botao-icone:hover{ background:var(--paper-deep); }
  .botao-icone.perigo:hover{ background:#F6E4E4; border-color:#E3B7B7; }
  .etiqueta{
    display:inline-block; font-size:12px; font-weight:600; padding:3px 10px; border-radius:20px;
    color:#fff; background:var(--cor-etiqueta, var(--ink-soft));
  }

  /* ---------- MODAL ---------- */
  .sobreposicao{ position:fixed; inset:0; background:rgba(24,34,56,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal-caixa{ background:var(--card); border-radius:var(--raio); padding:26px 26px 20px; width:100%; max-width:460px; max-height:88vh; overflow:auto; box-shadow:0 14px 40px rgba(0,0,0,0.25); }
  .modal-caixa form{ display:flex; flex-direction:column; gap:13px; margin-top:14px; }
  .acoes-modal{ display:flex; justify-content:flex-end; gap:10px; margin-top:8px; }
  textarea{ resize:vertical; min-height:64px; font-family:inherit; }

  /* ---------- RESPONSIVO ---------- */
  @media (max-width: 760px){
    .corpo{ flex-direction:column; }
    .lateral{ width:100%; flex-direction:row; overflow-x:auto; border-right:none; border-bottom:1px solid var(--rule); }
    .aba-lateral{ border-left:none; border-bottom:3px solid transparent; white-space:nowrap; border-radius:6px 6px 0 0; }
    .aba-lateral.ativa{ border-bottom-color:var(--accent); }
    .conteudo{ padding:18px; }
  }
</style>
</head>

<script>

/* ============================================================================

   no Supabase: usuários, opções por categoria e os registros do

function gerarUuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    const r = Math.random()*16|0, v = c==='x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}

let DEMO_DB = {

// mapa entre o nome "bonito" usado na tela (com acento) e a coluna real no banco.
// os campos personalizados (criados pelo admin) NÃO entram aqui — eles ficam
// guardados dentro da coluna "campos_extras" (formato flexível), não como
// colunas fixas, porque podem ser criados/removidos a qualquer momento.
const MAPA_CAMPOS_DB = { Assunto:'assunto', SubAssunto:'subassunto', Situação:'situacao', Responsável:'responsavel', Ação:'acao' };

function linhaParaRegistro(linha, camposPersonalizados){
  const registro = {
    ID: linha.id,
    Assunto: linha.assunto,
    SubAssunto: linha.subassunto,
    Situação: linha.situacao,
    Responsável: linha.responsavel,
    Ação: linha.acao
  };
  const extras = linha.campos_extras || {};
  (camposPersonalizados||[]).forEach(c=>{ registro[c.nome] = extras[c.nome] !== undefined ? extras[c.nome] : ''; });
  return registro;
}
function registroParaLinha(registro, camposPersonalizados){
  const saida = {};
  Object.entries(MAPA_CAMPOS_DB).forEach(([bonito, coluna])=>{
    if(registro[bonito] !== undefined) saida[coluna] = registro[bonito] === '' ? null : registro[bonito];
  });
  if(camposPersonalizados && camposPersonalizados.length){
    const extras = {};
    camposPersonalizados.forEach(c=>{ if(registro[c.nome] !== undefined) extras[c.nome] = registro[c.nome]; });
    saida.campos_extras = extras;
  }
  return saida;
}

let _clienteSupabase = null;
function clienteSupabase(){
  if(!_clienteSupabase){
    _clienteSupabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  }
  return _clienteSupabase;
}

async function supabaseCamposPersonalizados(){
  const { data, error } = await clienteSupabase().from('campos_personalizados').select('*').order('ordem');
  if(error) return [];
  return data.map(c=>({ id:c.id, nome:c.nome, tipo:c.tipo, opcoes:c.opcoes||[] }));
}
async function supabaseEsquema(){
  const { data, error } = await clienteSupabase().from('opcoes').select('categoria, valor').order('valor');
  if(error) return { ok:false, erro:'Falha ao carregar opções: ' + error.message };
  const mapa = {};
  data.forEach(r=>{ (mapa[r.categoria] = mapa[r.categoria]||[]).push(r.valor); });
  const camposPersonalizados = await supabaseCamposPersonalizados();
  const colunas = [
    { nome:'Assunto', tipo:'select', opcoes: mapa['Assunto']||[] },
    { nome:'SubAssunto', tipo:'select', opcoes: mapa['SubAssunto']||[] },
    { nome:'Situação', tipo:'select', opcoes: mapa['Situacao']||[] },
    { nome:'Responsável', tipo:'select', opcoes: mapa['Responsavel']||[] },
    ...camposPersonalizados.map(c=>({ nome:c.nome, tipo:c.tipo, opcoes:c.opcoes, personalizado:true, idPersonalizado:c.id })),
    { nome:'Ação', tipo:'texto_longo' }
  ];
  return { ok:true, abas: [{ nome:'Acompanhamento', colunas }] };
}
async function supabaseLogin(d){
  const { data, error } = await clienteSupabase().from('usuarios').select('usuario, papel')
    .eq('usuario', d.usuario).eq('senha', d.senha).maybeSingle();
  if(error) return { ok:false, erro:'Falha de conexão com o banco: ' + error.message };
  if(!data) return { ok:false, erro:'Usuário ou senha inválidos.' };
  return { ok:true, usuario:data.usuario, papel:data.papel||'operador' };
}
async function supabaseListar(){
  const camposPersonalizados = await supabaseCamposPersonalizados();
  const { data, error } = await clienteSupabase().from('acompanhamento').select('*');
  if(error) return { ok:false, erro:'Falha ao listar: ' + error.message };
  return { ok:true, registros: data.map(l=>linhaParaRegistro(l, camposPersonalizados)) };
}
async function supabaseVerificarSubAssuntoDuplicado(subassunto, idIgnorar){
  if(!subassunto) return null;
  let consulta = clienteSupabase().from('acompanhamento').select('id').eq('subassunto', subassunto);
  if(idIgnorar) consulta = consulta.neq('id', idIgnorar);
  const { data, error } = await consulta;
  if(error) return null; // não bloqueia por falha na checagem; deixa o salvar seguir e reportar o erro dele
  return (data && data.length>0)
    ? `Já existe um registro com o SubAssunto "${subassunto}". Edite o registro existente em vez de criar um novo.`
    : null;
}
async function supabaseCriar(d){
  const registro = d.registro || {};
  const erroDuplicado = await supabaseVerificarSubAssuntoDuplicado(registro.SubAssunto, null);
  if(erroDuplicado) return { ok:false, erro:erroDuplicado };
  const camposPersonalizados = await supabaseCamposPersonalizados();
  const { data, error } = await clienteSupabase().from('acompanhamento').insert(registroParaLinha(registro, camposPersonalizados)).select().single();
  if(error) return { ok:false, erro:'Falha ao criar: ' + error.message };
  return { ok:true, registro: linhaParaRegistro(data, camposPersonalizados) };
}
async function supabaseAtualizar(d){
  const registro = d.registro || {};
  if(registro.SubAssunto !== undefined){
    const { data: atual } = await clienteSupabase().from('acompanhamento').select('subassunto').eq('id', d.id).maybeSingle();
    if(atual && String(atual.subassunto) !== String(registro.SubAssunto)){
      const erroDuplicado = await supabaseVerificarSubAssuntoDuplicado(registro.SubAssunto, d.id);
      if(erroDuplicado) return { ok:false, erro:erroDuplicado };
    }
  }
  const camposPersonalizados = await supabaseCamposPersonalizados();
  const { error } = await clienteSupabase().from('acompanhamento').update(registroParaLinha(registro, camposPersonalizados)).eq('id', d.id);
  if(error) return { ok:false, erro:'Falha ao atualizar: ' + error.message };
  return { ok:true };
}
async function supabaseExcluir(d){
  const { error } = await clienteSupabase().from('acompanhamento').delete().eq('id', d.id);
  if(error) return { ok:false, erro:'Falha ao excluir: ' + error.message };
  return { ok:true };

/* ============================================================================
   CHAMADA ÚNICA DE API — usa o Supabase real se CONFIG.SUPABASE_URL estiver
   preenchida, ou os dados de demonstração acima se estiver vazia.
   ========================================================================== */
async function comTratativaDeErro(fn){
  try { return await fn(); }
  catch(erro){ return { ok:false, erro:'Falha de conexão com o banco: ' + (erro && erro.message ? erro.message : erro) }; }
}

function apiCall(action, data){
  data = data || {};
  if(!CONFIG.SUPABASE_URL){
    return new Promise(resolve=>{
      setTimeout(()=>{
        let resultado;
        switch(action){
          case 'login': resultado = demoLogin(data); break;
          case 'schema': resultado = demoEsquema(); break;
          case 'listar': resultado = demoListar(); break;
          case 'criar': resultado = demoCriar(data); break;
          case 'atualizar': resultado = demoAtualizar(data); break;
          case 'excluir': resultado = demoExcluir(data); break;
          case 'dashboard': resultado = demoDashboard(); break;
          case 'trocarSenha': resultado = demoTrocarSenha(data); break;
          case 'listarOpcoes': resultado = demoListarOpcoes(); break;
          case 'adicionarOpcao': resultado = demoAdicionarOpcao(data); break;
          case 'removerOpcao': resultado = demoRemoverOpcao(data); break;
          case 'listarCampos': resultado = demoListarCampos(); break;
          case 'criarCampo': resultado = demoCriarCampo(data); break;
          case 'excluirCampo': resultado = demoExcluirCampo(data); break;
          default: resultado = { ok:false, erro:'Ação desconhecida.' };
        }
        resolve(resultado);
      }, 260); // pequeno atraso só para o estado de "carregando" ficar visível
    });
  }
  switch(action){
    case 'login': return comTratativaDeErro(()=>supabaseLogin(data));
    case 'schema': return comTratativaDeErro(()=>supabaseEsquema());
    case 'listar': return comTratativaDeErro(()=>supabaseListar());
    case 'criar': return comTratativaDeErro(()=>supabaseCriar(data));
    case 'atualizar': return comTratativaDeErro(()=>supabaseAtualizar(data));
    case 'excluir': return comTratativaDeErro(()=>supabaseExcluir(data));
    case 'dashboard': return comTratativaDeErro(()=>supabaseDashboard());
    case 'trocarSenha': return comTratativaDeErro(()=>supabaseTrocarSenha(data));
    case 'listarOpcoes': return comTratativaDeErro(()=>supabaseListarOpcoes());
    case 'adicionarOpcao': return comTratativaDeErro(()=>supabaseAdicionarOpcao(data));
    case 'removerOpcao': return comTratativaDeErro(()=>supabaseRemoverOpcao(data));
    case 'listarCampos': return comTratativaDeErro(()=>supabaseListarCampos());
    case 'criarCampo': return comTratativaDeErro(()=>supabaseCriarCampo(data));
    case 'excluirCampo': return comTratativaDeErro(()=>supabaseExcluirCampo(data));
    default: return Promise.resolve({ ok:false, erro:'Ação desconhecida.' });
  }
}

const CHAVE_SESSAO = 'acompanhamentus_sessao';
function salvarSessao(usuario, papel){
  try { sessionStorage.setItem(CHAVE_SESSAO, JSON.stringify({ usuario, papel })); }
  catch(erro){ /* navegador sem sessionStorage disponível: painel continua funcionando, só não guarda a sessão */ }

    return bruto ? JSON.parse(bruto) : null;
  } catch(erro){ return null; }
}

  try { sessionStorage.removeItem(CHAVE_SESSAO); } catch(erro){ /* nada a fazer */ }
}

function escapeHtml(v){
  if(v===undefined||v===null) return '';
  return String(v).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function formatarHora(d){
  return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
function formatarDataBR(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');
  return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso||'');
}
function converterBRparaISO(brStr){
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(brStr||'').trim());
  return m ? `${m[3]}-${m[2]}-${m[1]}` : (brStr||'');
}

function filtrarContagemPositiva(contagem){
  const resultado = {};
  Object.entries(contagem||{}).forEach(([rotulo,valor])=>{ if(valor>0) resultado[rotulo]=valor; });
  return resultado;
}

function listaFracoesHTML(porSubAssunto){
  const entradas = Object.entries(porSubAssunto||{}).filter(([,v])=>v.registros>0);
  if(entradas.length===0) return '';
  return `<div class="lista-fracoes">
    ${entradas.map(([rotulo,v])=>`
      <div class="linha-fracao">
        <span class="rotulo-fracao">${escapeHtml(rotulo)}</span>
        <span class="valor-fracao mono">${v.registros} / ${v.acoes}</span>
      </div>`).join('')}
  </div>`;
}

function viewDashboard(){
  const painel = estado.painel || {};
  const todasAsAbas = Object.keys(painel);
  const abasComDados = todasAsAbas.filter(nome => painel[nome].total > 0);

  const cartoesGraficos = abasComDados.map(nome =>
    Object.keys(painel[nome].distribuicoes||{}).map(nomeColuna=>{
      // a coluna SubAssunto tem seu próprio card no formato x/y (registros / ações),
      // em vez do gráfico de barras genérico (que corta nomes longos e não mostra ações)
      if(nomeColuna.toLowerCase()==='subassunto' && painel[nome].porSubAssunto){
        const corpo = listaFracoesHTML(painel[nome].porSubAssunto);
        if(!corpo) return '';
        return `<div class="cartao-grafico">
          <h3>${escapeHtml(nome)} — ${escapeHtml(nomeColuna)}</h3>
          <p class="legenda-fracoes">registros / ações</p>
          ${corpo}
        </div>`;
      }
      const contagem = filtrarContagemPositiva(painel[nome].distribuicoes[nomeColuna]);
      if(Object.keys(contagem).length===0) return ''; // nada lançado nessa lista ainda: não mostra o card
      return `<div class="cartao-grafico">
        <h3>${escapeHtml(nome)} — ${escapeHtml(nomeColuna)}</h3>
        ${graficoBarrasSVG(contagem)}
      </div>`;
    }).join('')
  ).join('');

  return `
    <div class="cabecalho-conteudo">
      <h2>Dashboard</h2>
      ${barraAtualizacao()}
    </div>
    ${estado.erroAtualizacao ? `<div class="aviso-discreto">${escapeHtml(estado.erroAtualizacao)}</div>` : ''}
    ${todasAsAbas.length===0 ? '<p style="color:var(--ink-soft)">Carregando indicadores…</p>' : ''}
    ${todasAsAbas.length>0 && abasComDados.length===0 ? '<p style="color:var(--ink-soft)">Nenhum dado lançado ainda.</p>' : ''}
    ${abasComDados.length>0 ? `<div class="grade-kpis">
      ${abasComDados.map(nome=>`
        <div class="cartao-kpi">
          <div class="selo-kpi">${painel[nome].total}</div>
          <div class="rotulo-kpi">${escapeHtml(nome)}</div>
        </div>`).join('')}
    </div>` : ''}
    ${cartoesGraficos}
  `;
}

function graficoBarrasSVG(contagem){
  const entradas = Object.entries(contagem||{});
  if(entradas.length===0) return '';
  const max = Math.max(1, ...entradas.map(([,v])=>v));
  const alturaLinha = 26;
  const altura = entradas.length*alturaLinha + 8;
  const larguraBarra = 220;
  const barras = entradas.map(([rotulo,valor],i)=>{
    const y = i*alturaLinha;
    const largura = Math.max(2, Math.round((valor/max)*larguraBarra));
    const cor = corPaleta(i);
    const rotuloCurto = String(rotulo).length>16 ? String(rotulo).slice(0,15)+'…' : String(rotulo);
    return `<text x="0" y="${y+13}" class="rotulo-grafico">${escapeHtml(rotuloCurto)}</text>
            <rect x="120" y="${y+2}" width="${largura}" height="15" rx="3" fill="${cor}"></rect>
            <text x="${120+largura+8}" y="${y+13}" class="valor-grafico">${valor}</text>`;
  }).join('');
  return `<svg viewBox="0 0 380 ${altura}" class="svg-grafico" role="img" aria-label="Gráfico de distribuição">${barras}</svg>`;
}

function celulaFormatada(coluna, valor){
  if(valor===undefined||valor===null||valor==='') return '<span class="vazio-inline">—</span>';
  if(coluna.tipo==='select'){
    const idx = coluna.opcoes.indexOf(valor);
    return `<span class="etiqueta" style="--cor-etiqueta:${corPaleta(idx<0?0:idx)}">${escapeHtml(valor)}</span>`;
  }
  if(coluna.tipo==='data') return `<span class="mono">${escapeHtml(formatarDataBR(valor))}</span>`;
  if(coluna.tipo==='numero') return `<span class="mono">${escapeHtml(valor)}</span>`;
  if(coluna.tipo==='texto_longo') return `<span class="texto-longo-celula">${escapeHtml(valor)}</span>`;
  return escapeHtml(valor);
}

function renderizarLinhaAcao(linha){
  const m = /^(\[\d{2}\/\d{2}\/\d{4}\s+\d{2}:\d{2}\])\s*(.*)$/.exec(linha);
  if(m){
    return `<div class="linha-acao"><span class="carimbo-data-acao">${escapeHtml(m[1])}</span><span class="texto-acao">${escapeHtml(m[2])}</span></div>`;
  }
  return `<div class="linha-acao"><span class="texto-acao">${escapeHtml(linha)}</span></div>`;
}

function celulaAcaoFormatada(coluna, reg){
  const valor = reg[coluna.nome];
  if(!valor) return '<span class="vazio-inline">—</span>';
  const linhas = String(valor).split('\n').filter(l=>l.length>0);
  if(linhas.length===0) return '<span class="vazio-inline">—</span>';
  if(linhas.length <= 2){
    return `<div class="lista-acoes">${linhas.map(renderizarLinhaAcao).join('')}</div>`;
  }
  const expandido = estado.expandidos.has(String(reg.ID));
  const linhasParaMostrar = expandido ? linhas : linhas.slice(-2);
  const restantes = linhas.length - 2;
  return `<div class="lista-acoes">${linhasParaMostrar.map(renderizarLinhaAcao).join('')}</div>
    <button type="button" class="link-ver-mais" onclick="app.alternarExpandir('${escapeHtml(reg.ID)}')">
      ${expandido ? 'ver menos' : `ver mais (${restantes} ${restantes===1?'ação anterior':'ações anteriores'})`}
    </button>`;
}

function normalizarBusca(v){
  return String(v==null?'':v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function extrairMomentoRecente(reg, infoAba){
  // usa a data/hora da última ação lançada no histórico como critério de "mais recente".
  // registros sem nenhuma ação com data/hora ficam no final da lista.
  const colunaHistorico = infoAba.colunas.find(c=>c.tipo==='texto_longo');
  if(colunaHistorico && reg[colunaHistorico.nome]){
    const linhas = String(reg[colunaHistorico.nome]).split('\n').filter(l=>l.trim()!=='');
    const ultimaLinha = linhas[linhas.length-1] || '';
    const m = /\[(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})\]/.exec(ultimaLinha);
    if(m) return new Date(Number(m[3]), Number(m[2])-1, Number(m[1]), Number(m[4]), Number(m[5])).getTime();
  }
  return -Infinity;
}

function calcularLargurasColunas(colunas){
  const indiceAcao = colunas.findIndex(c=>c.tipo==='texto_longo');
  if(indiceAcao===-1){
    const larguraIgual = (100/colunas.length).toFixed(2)+'%';
    return colunas.map(()=>larguraIgual);
  }
  const larguraAcao = 40; // % priorizado para a coluna de Ação
  const outras = colunas.length - 1;
  const larguraOutras = outras>0 ? ((100-larguraAcao)/outras).toFixed(2) : '0';
  return colunas.map((c,i)=> i===indiceAcao ? larguraAcao+'%' : larguraOutras+'%');
}

function valoresDistintos(registros, nomeColuna){
  const set = new Set();
  registros.forEach(r=>{ const v=r[nomeColuna]; if(v) set.add(v); });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'pt-BR'));
}

function viewTabela(infoAba){
  const todosRegistros = (estado.cache[infoAba.nome] || []).slice()
    .sort((a,b) => extrairMomentoRecente(b, infoAba) - extrairMomentoRecente(a, infoAba));
  const colunas = infoAba.colunas.filter(c=>!c.ehId);
  const podeExcluir = estado.papel === 'admin';
  const colunasFiltraveis = colunas.filter(c=>c.tipo==='select');

  const termo = normalizarBusca(estado.filtro).trim();
  const filtrosAtivos = Object.entries(estado.filtrosColuna).filter(([,v])=>v);
  const registros = todosRegistros.filter(reg=>{
    if(termo && !colunas.some(c => normalizarBusca(reg[c.nome]).includes(termo))) return false;
    return filtrosAtivos.every(([nomeCol,valor]) => String(reg[nomeCol])===String(valor));
  });

  return `
    <div class="cabecalho-conteudo">
      <h2>${escapeHtml(infoAba.nome)}</h2>
      <div class="acoes-cabecalho">
        ${barraAtualizacao()}
        <button class="botao-primario" onclick="app.abrirNovo('${escapeHtml(infoAba.nome)}')">+ Novo registro</button>
      </div>
    </div>
    ${estado.erroAtualizacao ? `<div class="aviso-discreto">${escapeHtml(estado.erroAtualizacao)}</div>` : ''}
    <div class="barra-busca">
      <input type="text" id="buscaTabela" placeholder="🔎 Localizar um registro já preenchido (busca em todas as colunas)…" value="${escapeHtml(estado.filtro)}" oninput="app.filtrarTabela(this.value)">
      ${(termo || filtrosAtivos.length>0) ? `<span class="contagem-busca">${registros.length} de ${todosRegistros.length}</span>` : ''}
    </div>
    ${colunasFiltraveis.length>0 ? `<div class="barra-filtros">
      ${colunasFiltraveis.map(c=>{
        const valorAtual = estado.filtrosColuna[c.nome] || '';
        const opcoesPresentes = valoresDistintos(todosRegistros, c.nome);
        return `<select onchange="app.filtrarPorColuna('${escapeHtml(c.nome)}', this.value)">
          <option value="">${escapeHtml(c.nome)} — todos</option>
          ${opcoesPresentes.map(op=>`<option value="${escapeHtml(op)}" ${op===valorAtual?'selected':''}>${escapeHtml(op)}</option>`).join('')}
        </select>`;
      }).join('')}
      ${filtrosAtivos.length>0 ? `<button type="button" class="botao-secundario" onclick="app.limparFiltrosColuna()">Limpar filtros</button>` : ''}
    </div>` : ''}
    <div class="area-tabela">
      <table class="tabela-ledger">
        <colgroup>
          ${calcularLargurasColunas(colunas).map(w=>`<col style="width:${w}">`).join('')}
          <col style="width:84px">
        </colgroup>
        <thead><tr>${colunas.map(c=>`<th>${escapeHtml(c.nome)}</th>`).join('')}<th></th></tr></thead>
        <tbody>
          ${registros.length===0 ? `<tr><td colspan="${colunas.length+1}" class="vazio">${(termo||filtrosAtivos.length>0) ? 'Nenhum registro encontrado para esse filtro.' : 'Nenhum registro ainda. Use "Novo registro" para começar.'}</td></tr>` :
            registros.map(reg=>`
            <tr>
              ${colunas.map(c=> c.tipo==='texto_longo' ? `<td>${celulaAcaoFormatada(c, reg)}</td>` : `<td>${celulaFormatada(c, reg[c.nome])}</td>`).join('')}
              <td class="celula-acoes">
                <button class="botao-icone" title="Editar / acrescentar ação" onclick="app.abrirEditar('${escapeHtml(infoAba.nome)}','${escapeHtml(reg.ID)}')">✎</button>
                ${podeExcluir ? `<button class="botao-icone perigo" title="Excluir" onclick="app.excluirRegistro('${escapeHtml(infoAba.nome)}','${escapeHtml(reg.ID)}')">🗑</button>` : ''}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function localizarColunaResponsavel(colunas){
  return (colunas||[]).find(c => c.tipo==='select' && normalizarBusca(c.nome)==='responsavel');
}

function campoFormulario(coluna, valorAtual, indice, todasColunas, somenteLeitura){
  const id = 'campo_'+indice;
  const rotulo = escapeHtml(coluna.nome);
  const desabilitado = somenteLeitura ? 'disabled' : '';
  if(coluna.tipo==='select'){
    return `<label>${rotulo}
      <select id="${id}" ${desabilitado}>
        <option value="">— selecione —</option>
        ${coluna.opcoes.map(op=>`<option value="${escapeHtml(op)}" ${op===valorAtual?'selected':''}>${escapeHtml(op)}</option>`).join('')}
      </select>
    </label>`;
  }
  if(coluna.tipo==='numero') return `<label>${rotulo}<input type="number" step="any" id="${id}" value="${escapeHtml(valorAtual)}" ${desabilitado}></label>`;
  if(coluna.tipo==='data') return `<label>${rotulo}<input type="text" id="${id}" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" value="${escapeHtml(formatarDataBR(valorAtual))}" oninput="app.mascararData(this)" ${desabilitado}></label>`;
  if(coluna.tipo==='texto_longo'){
    const podeEditarTextoLivre = estado.papel === 'admin';
    return `<label>${rotulo}
        <textarea id="${id}" rows="6" class="${podeEditarTextoLivre?'':'textarea-somente-leitura'}" ${podeEditarTextoLivre?'':'readonly'} placeholder="${podeEditarTextoLivre?'Histórico de ações — você pode editar livremente aqui.':'O histórico aparece aqui — use os campos abaixo para adicionar uma nova ação.'}">${escapeHtml(valorAtual||'')}</textarea>
      </label>
      <div class="ferramenta-historico">
        <input type="text" id="${id}_novaEntrada" placeholder="Nova ação realizada agora…">
        <input type="text" id="${id}_comissaoEntrada" placeholder="Comissão — nomes das pessoas envolvidas nesta ação (opcional)">
        <button type="button" class="botao-secundario" onclick="app.adicionarEntradaHistorico('${id}')">+ Adicionar ao histórico</button>
      </div>`;
  }
  return `<label>${rotulo}<input type="text" id="${id}" value="${escapeHtml(valorAtual||'')}" ${desabilitado}></label>`;
}

function viewModal(){
  const { aba, id, registroAtual } = estado.modal;
  const infoAba = estado.schema.find(a=>a.nome===aba);
  const campos = infoAba.colunas.filter(c=>!c.ehId);
  const somenteAcao = !!id && estado.papel !== 'admin'; // operador editando um registro existente: só pode acrescentar ação (e alterar o Responsável)
  const colunaResponsavel = localizarColunaResponsavel(campos);
  return `
    <div class="sobreposicao" onclick="app.fecharModalSeClicarFora(event)">
      <div class="modal-caixa">
        <h3>${id ? 'Editar registro' : 'Novo registro'}</h3>
        <p class="subtitulo" style="margin-bottom:0">${escapeHtml(aba)}</p>
        ${somenteAcao ? `<div class="aviso-discreto" style="margin-top:12px">Como operador, você só pode acrescentar uma nova ação${colunaResponsavel?` e alterar o(a) ${escapeHtml(colunaResponsavel.nome)}`:''}. Os demais campos estão bloqueados — apenas o admin pode alterá-los.</div>` : ''}
        <form onsubmit="app.salvarRegistro(event)">
          ${campos.map((c,i)=>campoFormulario(c, registroAtual ? registroAtual[c.nome] : '', i, campos, somenteAcao && c.tipo!=='texto_longo' && c!==colunaResponsavel)).join('')}
          ${estado.enviando ? barraProgresso() : ''}
          <div class="acoes-modal">
            <button type="button" class="botao-secundario" onclick="app.fecharModal()" ${estado.enviando?'disabled':''}>Cancelar</button>
            <button type="submit" class="botao-primario" ${estado.enviando?'disabled':''}>${estado.enviando?'Salvando…':'Salvar'}</button>
          </div>
        </form>
      </div>
    </div>`;
}

  const campos = estado.configCampos || [];

  return `
    <div class="cabecalho-conteudo">
      <h2>Configurações</h2>
    </div>
    ${estado.configErro ? `<div class="aviso-discreto">${escapeHtml(estado.configErro)}</div>` : ''}

    <div class="cartao-config">
      <h3>Respostas das listas</h3>
      <p class="subtitulo" style="margin:0 0 14px">Adicione ou remova as opções que aparecem nos menus suspensos.</p>
      <div class="abas-config">
        ${CATEGORIAS_OPCOES.map(c=>`<button class="aba-config ${categoriaAtual===c.chave?'ativa':''}" onclick="app.selecionarCategoriaConfig('${c.chave}')">${escapeHtml(c.rotulo)}</button>`).join('')}
      </div>
      <div class="lista-opcoes-config">
        ${listaAtual.length===0 ? '<p class="vazio-inline">Nenhuma opção cadastrada ainda.</p>' : listaAtual.map(op=>`
          <span class="chip-opcao">
            ${escapeHtml(op)}
            <button type="button" title="Remover" onclick="app.removerOpcaoConfig('${categoriaAtual}', ${JSON.stringify(op)})">×</button>
          </span>`).join('')}
      </div>
      <form class="form-nova-opcao" onsubmit="app.adicionarOpcaoConfig(event)">
        <input type="text" id="novaOpcaoTexto" placeholder="Nova opção para ${escapeHtml(CATEGORIAS_OPCOES.find(c=>c.chave===categoriaAtual).rotulo)}…" required>
        <button type="submit" class="botao-secundario" ${estado.enviando?'disabled':''}>+ Adicionar</button>
      </form>
    </div>

    <div class="cartao-config">
      <h3>Campos personalizados</h3>
      <p class="subtitulo" style="margin:0 0 14px">Crie campos novos (lista, texto, número ou data) para o formulário do Acompanhamento. Os 5 campos padrão do sistema não podem ser removidos.</p>
      <div class="lista-campos-config">
        ${campos.length===0 ? '<p class="vazio-inline">Nenhum campo personalizado ainda.</p>' : campos.map(c=>`
          <div class="linha-campo-config">
            <span class="nome-campo-config">${escapeHtml(c.nome)}</span>
            <span class="tipo-campo-config">${escapeHtml(rotuloTipoCampo(c.tipo))}${c.tipo==='select' ? ` (${(c.opcoes||[]).length} opções)` : ''}</span>
            <button type="button" class="botao-icone perigo" title="Excluir campo" onclick="app.excluirCampoConfig(${c.id}, '${escapeHtml(c.nome)}')">🗑</button>
          </div>`).join('')}
      </div>
      <button type="button" class="botao-primario" style="margin-top:12px" onclick="app.abrirNovoCampo()">+ Novo campo</button>
    </div>
  `;
}

function rotuloTipoCampo(tipo){
  return { select:'Lista de opções', texto:'Texto', texto_longo:'Texto longo', numero:'Número', data:'Data' }[tipo] || tipo;
}

function viewModalNovoCampo(){
  const tipo = estado.modalNovoCampo.tipo || 'select';
  return `
    <div class="sobreposicao" onclick="app.fecharModalSeClicarForaNovoCampo(event)">
      <div class="modal-caixa">
        <h3>Novo campo personalizado</h3>
        <form onsubmit="app.salvarNovoCampo(event)">
          <label>Nome do campo<input type="text" id="nomeNovoCampo" placeholder="ex.: Prazo, Prioridade..." required></label>
          <label>Tipo
            <select id="tipoNovoCampo" onchange="app.mudarTipoNovoCampo(this.value)">
              <option value="select" ${tipo==='select'?'selected':''}>Lista de opções</option>
              <option value="texto" ${tipo==='texto'?'selected':''}>Texto</option>
              <option value="texto_longo" ${tipo==='texto_longo'?'selected':''}>Texto longo (várias linhas)</option>
              <option value="numero" ${tipo==='numero'?'selected':''}>Número</option>
              <option value="data" ${tipo==='data'?'selected':''}>Data</option>
            </select>
          </label>
          ${tipo==='select' ? `<label>Opções da lista (uma por linha)
            <textarea id="opcoesNovoCampo" rows="4" placeholder="Baixa
Média
Alta"></textarea>
          </label>` : ''}
          ${estado.configErro ? `<div class="aviso-erro">${escapeHtml(estado.configErro)}</div>` : ''}
          ${estado.enviando ? barraProgresso() : ''}
          <div class="acoes-modal">
            <button type="button" class="botao-secundario" onclick="app.fecharNovoCampo()" ${estado.enviando?'disabled':''}>Cancelar</button>
            <button type="submit" class="botao-primario" ${estado.enviando?'disabled':''}>${estado.enviando?'Salvando…':'Criar campo'}</button>
          </div>
        </form>
      </div>
    </div>`;
}

/* ============================================================================
   AÇÕES DO PAINEL (chamadas pelos onclick/onsubmit no HTML acima)
   ========================================================================== */
const app = {
  async entrar(e){
    e.preventDefault();
    const usuario = document.getElementById('campoUsuario').value.trim();
    const senha = document.getElementById('campoSenha').value;
    estado.enviando = true;
    estado.erroLogin = null;
    renderizar();
    const resp = await apiCall('login', { usuario, senha });
    if(resp.ok){
      estado.usuario = resp.usuario;
      estado.papel = resp.papel;
      estado.erroLogin = null;
      const respSchema = await apiCall('schema', {});
      estado.enviando = false;
      if(respSchema.ok){
        estado.schema = respSchema.abas;
        estado.abaAtiva = 'dashboard';
        salvarSessao(estado.usuario, estado.papel);
        renderizar();
        app.atualizarDados();
      } else {
        estado.erroLogin = 'Não foi possível carregar a estrutura da planilha: ' + (respSchema.erro||'');
        estado.usuario = null; estado.papel = null;
        renderizar();
      }
    } else {
      estado.enviando = false;
      estado.erroLogin = resp.erro || 'Não foi possível entrar.';
      renderizar();
    }
  },

  sair(){
    if(estado.timerAuto) clearInterval(estado.timerAuto);
    limparSessaoSalva();
    estado = estadoInicial();
    renderizar();
  },

  selecionarAba(nome){
    estado.abaAtiva = nome;
    estado.filtro = '';
    estado.filtrosColuna = {};
    estado.erroAtualizacao = null;
    renderizar();
    app.atualizarDados();
  },

  filtrarTabela(valor){
    estado.filtro = valor;
    const posicaoCursor = valor.length;
    renderizar();
    const campoBusca = document.getElementById('buscaTabela');
    if(campoBusca){
      campoBusca.focus();
      campoBusca.setSelectionRange(posicaoCursor, posicaoCursor);
    }
  },

  filtrarPorColuna(nomeColuna, valor){
    estado.filtrosColuna = { ...estado.filtrosColuna, [nomeColuna]: valor };
    renderizar();
  },

  limparFiltrosColuna(){
    estado.filtrosColuna = {};
    renderizar();
  },

  alternarExpandir(id){
    if(estado.expandidos.has(id)) estado.expandidos.delete(id);
    else estado.expandidos.add(id);
    renderizar();
  },

  async atualizarDados(){
    estado.carregando = true;
    renderizar();
    try{
      if(estado.abaAtiva === 'dashboard'){
        const resp = await apiCall('dashboard', {});
        if(!resp.ok) throw new Error(resp.erro || 'Falha ao buscar indicadores.');
        estado.painel = resp.painel;
      } else {
        const resp = await apiCall('listar', { aba: estado.abaAtiva });
        if(!resp.ok) throw new Error(resp.erro || 'Falha ao buscar dados.');
        estado.cache[estado.abaAtiva] = resp.registros;
      }
      estado.ultimaAtualizacao = new Date();
      estado.erroAtualizacao = null;
    } catch(err){
      estado.erroAtualizacao = 'Não foi possível atualizar agora. Mostrando os últimos dados carregados.';
    } finally {
      estado.carregando = false;
      renderizar();
    }
  },

  toggleAutoAtualizar(){
    estado.autoAtualizar = !estado.autoAtualizar;
    if(estado.autoAtualizar){
      estado.timerAuto = setInterval(()=>app.atualizarDados(), estado.intervaloMin*60*1000);
    } else if(estado.timerAuto){
      clearInterval(estado.timerAuto);
      estado.timerAuto = null;
    }
    renderizar();
  },

  mudarIntervalo(min){
    estado.intervaloMin = Number(min);
    if(estado.autoAtualizar && estado.timerAuto){
      clearInterval(estado.timerAuto);
      estado.timerAuto = setInterval(()=>app.atualizarDados(), estado.intervaloMin*60*1000);
    }
  },

  abrirNovo(aba){
    estado.modal = { aba, id:null, registroAtual:null };
    renderizar();
  },
  abrirEditar(aba, id){
    const registro = (estado.cache[aba]||[]).find(r=>String(r.ID)===String(id));
    estado.modal = { aba, id, registroAtual: registro };
    renderizar();
  },
  fecharModal(){ estado.modal = null; renderizar(); },
  fecharModalSeClicarFora(e){ if(e.target.classList.contains('sobreposicao')) app.fecharModal(); },

  adicionarEntradaHistorico(idCampo){
    const campoNovaEntrada = document.getElementById(idCampo+'_novaEntrada');
    const areaTexto = document.getElementById(idCampo);
    const campoComissao = document.getElementById(idCampo+'_comissaoEntrada');
    const texto = campoNovaEntrada.value.trim();
    if(!texto) { campoNovaEntrada.focus(); return; }
    const agora = new Date();
    const dataHora = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
    const comissao = campoComissao ? campoComissao.value.trim() : '';
    const sufixoComissao = comissao ? ` — Comissão: ${comissao}` : '';
    const linhaNova = `[${dataHora}] ${texto}${sufixoComissao}`;
    areaTexto.value = areaTexto.value ? (areaTexto.value + '\n' + linhaNova) : linhaNova;
    campoNovaEntrada.value = '';
    if(campoComissao) campoComissao.value = '';
    areaTexto.scrollTop = areaTexto.scrollHeight;
    campoNovaEntrada.focus();
  },

  mascararData(el){
    const digitos = el.value.replace(/\D/g,'').slice(0,8);
    let formatado = digitos;
    if(digitos.length > 4) formatado = digitos.slice(0,2)+'/'+digitos.slice(2,4)+'/'+digitos.slice(4);
    else if(digitos.length > 2) formatado = digitos.slice(0,2)+'/'+digitos.slice(2);
    el.value = formatado;
  },

  async salvarRegistro(e){
    e.preventDefault();
    const { aba, id } = estado.modal;
    const infoAba = estado.schema.find(a=>a.nome===aba);
    const campos = infoAba.colunas.filter(c=>!c.ehId);
    const registro = {};
    campos.forEach((c,i)=>{
      const el = document.getElementById('campo_'+i);
      if(!el) return;
      registro[c.nome] = (c.tipo==='data') ? converterBRparaISO(el.value) : el.value;
    });
    estado.enviando = true;
    renderizar();
    const resp = id
      ? await apiCall('atualizar', { aba, id, registro })
      : await apiCall('criar', { aba, registro });
    estado.enviando = false;
    if(resp.ok){
      estado.modal = null;
      app.atualizarDados();
    } else {
      renderizar();
      alert('Não foi possível salvar: ' + (resp.erro || 'erro desconhecido.'));
    }
  },

  async excluirRegistro(aba, id){
    if(!confirm('Tem certeza que deseja excluir este registro? Essa ação não pode ser desfeita.')) return;
    const resp = await apiCall('excluir', { aba, id });
    if(resp.ok){ app.atualizarDados(); }
    else { alert('Não foi possível excluir: ' + (resp.erro || 'erro desconhecido.')); }
  },

  abrirModalSenha(){
    estado.modalSenha = true;
    estado.erroSenha = null;
    estado.sucessoSenha = null;
    renderizar();
  },
  fecharModalSenha(){
    estado.modalSenha = false;
    renderizar();
  },
  fecharModalSeClicarForaSenha(e){
    if(e.target.classList.contains('sobreposicao')) app.fecharModalSenha();
  },
  async trocarSenha(e){
    e.preventDefault();
    const senhaAtual = document.getElementById('senhaAtual').value;
    const novaSenha = document.getElementById('novaSenha').value;
    const confirmarNovaSenha = document.getElementById('confirmarNovaSenha').value;
    if(novaSenha !== confirmarNovaSenha){
      estado.erroSenha = 'A nova senha e a confirmação não coincidem.';
      estado.sucessoSenha = null;
      renderizar();
      return;
    }
    estado.enviando = true;
    renderizar();
    const resp = await apiCall('trocarSenha', { usuario: estado.usuario, senhaAtual, novaSenha });
    estado.enviando = false;
    if(resp.ok){
      estado.erroSenha = null;
      estado.sucessoSenha = 'Senha alterada com sucesso.';
      renderizar();
      setTimeout(()=>{
        if(estado.sucessoSenha){ estado.modalSenha = false; estado.sucessoSenha = null; renderizar(); }
      }, 1400);
    } else {
      estado.sucessoSenha = null;
      estado.erroSenha = resp.erro || 'Não foi possível alterar a senha.';
      renderizar();
    }
  },

  /* ---------- Configurações (admin) ---------- */
  async abrirConfiguracoes(){
    estado.abaAtiva = 'configuracoes';
    estado.configErro = null;
    renderizar();
    estado.carregando = true;
    renderizar();
    const [respOpcoes, respCampos] = await Promise.all([apiCall('listarOpcoes', {}), apiCall('listarCampos', {})]);
    estado.carregando = false;
    if(respOpcoes.ok) estado.configOpcoes = respOpcoes.porCategoria;
    if(respCampos.ok) estado.configCampos = respCampos.campos;
    if(!respOpcoes.ok || !respCampos.ok) estado.configErro = respOpcoes.erro || respCampos.erro;
    renderizar();
  },

  selecionarCategoriaConfig(categoria){
    estado.configCategoria = categoria;
    estado.configErro = null;
    renderizar();
  },

  async adicionarOpcaoConfig(e){
    e.preventDefault();
    const campo = document.getElementById('novaOpcaoTexto');
    const valor = campo.value.trim();
    if(!valor) return;
    estado.enviando = true;
    renderizar();
    const resp = await apiCall('adicionarOpcao', { categoria: estado.configCategoria, valor });
    estado.enviando = false;
    if(resp.ok){
      estado.configOpcoes[estado.configCategoria] = [...(estado.configOpcoes[estado.configCategoria]||[]), valor];
      estado.configErro = null;
    } else {
      estado.configErro = resp.erro || 'Não foi possível adicionar a opção.';
    }
    renderizar();
  },

  async removerOpcaoConfig(categoria, valor){
    if(!confirm(`Remover "${valor}" da lista de ${categoria}? Registros que já usam esse valor não são alterados.`)) return;
    estado.enviando = true;
    renderizar();
    const resp = await apiCall('removerOpcao', { categoria, valor });
    estado.enviando = false;
    if(resp.ok){
      estado.configOpcoes[categoria] = (estado.configOpcoes[categoria]||[]).filter(v=>v!==valor);
    } else {
      estado.configErro = resp.erro || 'Não foi possível remover a opção.';
    }
    renderizar();
  },

  abrirNovoCampo(){
    estado.modalNovoCampo = { tipo:'select' };
    estado.configErro = null;
    renderizar();
  },
  fecharNovoCampo(){
    estado.modalNovoCampo = null;
    renderizar();
  },
  fecharModalSeClicarForaNovoCampo(e){
    if(e.target.classList.contains('sobreposicao')) app.fecharNovoCampo();
  },
  mudarTipoNovoCampo(tipo){
    estado.modalNovoCampo = { tipo };
    renderizar();
  },
  async salvarNovoCampo(e){
    e.preventDefault();
    const nome = document.getElementById('nomeNovoCampo').value.trim();
    const tipo = document.getElementById('tipoNovoCampo').value;
    let opcoes = [];
    if(tipo==='select'){
      const bruto = document.getElementById('opcoesNovoCampo').value;
      opcoes = bruto.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
    }
    estado.enviando = true;
    renderizar();
    const resp = await apiCall('criarCampo', { nome, tipo, opcoes });
    estado.enviando = false;
    if(resp.ok){
      estado.modalNovoCampo = null;
      estado.configErro = null;
      estado.configCampos = [...(estado.configCampos||[]), resp.campo];
      const respSchema = await apiCall('schema', {});
      if(respSchema.ok) estado.schema = respSchema.abas;
      renderizar();
    } else {
      estado.configErro = resp.erro || 'Não foi possível criar o campo.';
      renderizar();
    }
  },
  async excluirCampoConfig(id, nome){
    if(!confirm(`Excluir o campo "${nome}"? Os valores já preenchidos nesse campo deixam de aparecer, mas não são apagados do banco.`)) return;
    estado.enviando = true;
    renderizar();
    const resp = await apiCall('excluirCampo', { id });
    estado.enviando = false;
    if(resp.ok){
      estado.configCampos = (estado.configCampos||[]).filter(c=>c.id!==id);
      const respSchema = await apiCall('schema', {});
      if(respSchema.ok) estado.schema = respSchema.abas;
    } else {
      estado.configErro = resp.erro || 'Não foi possível excluir o campo.';
    }
    renderizar();
  }
};
window.app = app;

/* ============================================================================
   INICIALIZAÇÃO — se já houver uma sessão salva (usuário logado antes de
   atualizar a página), restaura ela em vez de voltar para a tela de login.
   ========================================================================== */
(async function iniciarApp(){
  const sessaoSalva = lerSessaoSalva();
  if(!sessaoSalva || !sessaoSalva.usuario){
    renderizar();
    return;
  }
  estado.usuario = sessaoSalva.usuario;
  estado.papel = sessaoSalva.papel;
  estado.carregando = true;
  renderizar(); // mostra a tela do painel já "logada" enquanto os dados carregam
  const respSchema = await apiCall('schema', {});
  estado.carregando = false;
  if(respSchema.ok){
    estado.schema = respSchema.abas;
    estado.abaAtiva = 'dashboard';
    renderizar();
    app.atualizarDados();
  } else {
    // não foi possível confirmar a sessão (banco fora do ar, etc.) — volta pro login
    limparSessaoSalva();
    estado = estadoInicial();
    estado.erroLogin = 'Não foi possível restaurar sua sessão. Entre novamente.';
    renderizar();
  }
})();
</script>
